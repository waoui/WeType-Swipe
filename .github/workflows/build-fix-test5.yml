name: 修复 test5 签名构建

on:
  pull_request:
    branches:
      - codex/fix-v1.11.9-test5-insets-sync
    paths:
      - ".github/workflows/build-fix-test5.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: 8b073877fb50d17396ee60a5efa53a6b51a45e87
      SIGNING_STORE_FILE: ${{ github.workspace }}/signing.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: 1082df3bac441e9bd020ce640d66924de6c7dfb70836b262743e15777863c93a
      VERSION: 1.11.9-test5

    steps:
      - name: 检出独立构建分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: 确认源码完全对应 test5
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/build-fix-test5.yml"
          grep -q '^VERSION_CODE=60$' gradle.properties
          grep -q '^VERSION_NAME=1.11.9-test5$' gradle.properties

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 恢复永久签名证书
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"

      - name: 单元测试、Lint 与 Release 构建
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintRelease assembleRelease

      - name: 校验版本与永久签名证书
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/WeType_Swipe_LSPosed_v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          badge="$("$aapt" dump badging "$apk" | head -n 1)"
          printf '%s\n' "$badge"
          [[ "$badge" == *"versionCode='60'"*"versionName='1.11.9-test5'"* ]]
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          verification="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"
          normalized="$(printf '%s' "$verification" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          case "$normalized" in
            *"$EXPECTED_CERT_SHA256"*) ;;
            *) echo "Unexpected signing certificate" >&2; exit 1 ;;
          esac

      - name: 整理测试附件
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=WeType-Swipe-v1.11.9-test5/ \
            --output=release/WeType_Swipe_LSPosed_v1.11.9-test5_source.zip "$SOURCE_COMMIT"
          cp TEST_NOTES_v1.11.9-test5.md release/
          (
            cd release
            sha256sum WeType_Swipe_LSPosed_v1.11.9-test5.apk \
              WeType_Swipe_LSPosed_v1.11.9-test5_source.zip \
              TEST_NOTES_v1.11.9-test5.md > WeType_Swipe_v1.11.9-test5_SHA256SUMS.txt
          )

      - name: 上传签名候选包
        uses: actions/upload-artifact@v4
        with:
          name: WeType-Swipe-v1.11.9-test5-fix-signed
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: 清理签名文件
        if: always()
        shell: bash
        run: rm -f "$SIGNING_STORE_FILE"
