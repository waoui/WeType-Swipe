name: 性能热路径优化测试构建

on:
  push:
    branches:
      - codex/perf-hotpath-v1.11.9-test3
    paths:
      - ".github/workflows/build-perf-hotpath-test.yml"
      - "tools/patch_perf_hotpath_test3.py"
      - "app/src/main/java/com/rww/wetypeswipe/**"
      - "app/src/test/java/com/rww/wetypeswipe/**"
      - "gradle.properties"
      - "TEST_NOTES_v1.11.9-test3.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIGNING_STORE_FILE: ${{ github.workspace }}/signing.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: 1082df3bac441e9bd020ce640d66924de6c7dfb70836b262743e15777863c93a
      VERSION: 1.11.9-test3

    steps:
      - name: 检出测试分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 应用性能热路径补丁
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_perf_hotpath_test3.py
          grep -q '^VERSION_CODE=58$' gradle.properties
          grep -q '^VERSION_NAME=1.11.9-test3$' gradle.properties
          grep -q 'KeyboardLabelSnapshot keyboardLabelSnapshot' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          grep -q 'keyboardLabelResolvedClasses' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          grep -q 'KeyboardRuntimeState runtimeState' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          grep -q 'keyboardLabelPaint.getFontMetrics(keyboardLabelMetrics)' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          grep -q 'hot-path performance optimizations enabled' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          ! grep -q 'nativeSingleKeyLabelCache' app/src/main/java/com/rww/wetypeswipe/MainHook.java

      - name: 恢复永久签名证书
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"

      - name: 单元测试、Lint 与 Release 构建
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintRelease assembleRelease

      - name: 校验永久签名 APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          verification="$($apksigner verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"
          normalized="$(printf '%s' "$verification" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          case "$normalized" in
            *"$EXPECTED_CERT_SHA256"*) ;;
            *) echo "Unexpected signing certificate" >&2; exit 1 ;;
          esac

      - name: 固化干净性能源码
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/patch_perf_hotpath_test3.py
          rm -f .github/workflows/build-perf-hotpath-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "固化 v1.11.9-test3 性能热路径优化"
            git push origin HEAD:codex/perf-hotpath-v1.11.9-test3
          fi

      - name: 整理测试附件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/WeType_Swipe_LSPosed_v${VERSION}.apk"
          source="release/WeType_Swipe_LSPosed_v${VERSION}_source.zip"
          sums="release/WeType_Swipe_v${VERSION}_SHA256SUMS.txt"
          notes="release/TEST_NOTES_v${VERSION}.md"

          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp TEST_NOTES_v1.11.9-test3.md "$notes"

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          out = Path('release/WeType_Swipe_LSPosed_v1.11.9-test3_source.zip')
          skip_parts = {'.git', '.gradle', 'build', 'release'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  if any(part in skip_parts for part in path.parts):
                      continue
                  if path.name == 'signing.jks':
                      continue
                  z.write(path, Path('WeType-Swipe-v1.11.9-test3') / path)
          PY

          (
            cd release
            sha256sum "$(basename "$apk")" "$(basename "$source")" "$(basename "$notes")" > "$(basename "$sums")"
          )

      - name: 上传测试附件
        uses: actions/upload-artifact@v4
        with:
          name: WeType-Swipe-v1.11.9-test3-perf-signed
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: 清理签名文件
        if: always()
        shell: bash
        run: rm -f "$SIGNING_STORE_FILE"
