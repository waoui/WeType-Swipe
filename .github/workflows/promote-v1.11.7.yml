name: 正式化 v1.11.7 源码

on:
  push:
    branches:
      - release/v1.11.7
    paths:
      - ".github/workflows/promote-v1.11.7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出正式分支
        uses: actions/checkout@v4
        with:
          ref: release/v1.11.7
          fetch-depth: 0

      - name: 生成正式源码
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "release/v1.11.7"
          git fetch origin codex/wetype-4.0.0-compat-v1.11.7-test2

          mkdir -p tools app/src/main/java/com/rww/wetypeswipe app/src/test/java/com/rww/wetypeswipe
          git show origin/codex/wetype-4.0.0-compat-v1.11.7-test2:tools/patch_wetype_4_compat_test.py > tools/_promote_patch1.py
          git show origin/codex/wetype-4.0.0-compat-v1.11.7-test2:tools/patch_wetype_4_native_panel_test2.py > tools/_promote_patch2.py
          git show origin/codex/wetype-4.0.0-compat-v1.11.7-test2:app/src/main/java/com/rww/wetypeswipe/ToolbarCarrierLayout.java > app/src/main/java/com/rww/wetypeswipe/ToolbarCarrierLayout.java
          git show origin/codex/wetype-4.0.0-compat-v1.11.7-test2:app/src/test/java/com/rww/wetypeswipe/ToolbarCarrierLayoutTest.java > app/src/test/java/com/rww/wetypeswipe/ToolbarCarrierLayoutTest.java

          python3 tools/_promote_patch1.py
          python3 tools/_promote_patch2.py

          sed -i 's/^VERSION_CODE=52$/VERSION_CODE=53/' gradle.properties
          sed -i 's/^VERSION_NAME=1.11.7-test2$/VERSION_NAME=1.11.7/' gradle.properties
          sed -i 's/v1\.11\.7-test2 entered target package; WeType 4\.0\.0 keyboard and native-panel compatibility enabled/v1.11.7 entered target package; WeType 4.0.0 keyboard and native-panel compatibility enabled/' app/src/main/java/com/rww/wetypeswipe/MainHook.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          entry = '''## v1.11.7\n\n- 兼容微信输入法 4.0.0：自绘键盘公共基类由旧版 `selfdraw.n` 变为 `selfdraw.o` 后，26 键与九宫格下滑功能恢复正常\n- 键盘基类识别增加结构特征回退，避免仅因单字母混淆类名变化导致整个模块失效\n- 兼容微信输入法 4.0.0 原生工具栏命令载体从旧 `f/g/h` 到新 `g/h/i` 的字段位移\n- 恢复 4.0.0 下滑打开原生剪贴板和快捷发送／常用语\n- 4.0.0 原生面板调用在识别新布局时直接进入具体 ViewHolder 点击处理链，规避新增协程包装的时序影响\n- 新增工具栏载体布局单元测试，覆盖旧布局、4.0.0 布局和字段重命名结构回退\n- 动作 ID、配置格式、默认键位及 v1.11.6 既有功能保持不变\n\n'''
          if '## v1.11.7\n' not in s:
              s = s.replace('# 更新记录\n\n', '# 更新记录\n\n' + entry, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('当前稳定版本：**v1.11.6**', '当前稳定版本：**v1.11.7**')
          start = s.index('## v1.11.6 更新内容')
          end = s.index('\n## 兼容性', start)
          section = '''## v1.11.7 更新内容\n\n- 兼容微信输入法 4.0.0，自绘键盘公共基类从旧版 `selfdraw.n` 迁移到 `selfdraw.o` 后，下滑手势仍可正常识别。\n- 键盘基类识别增加结构特征回退，降低后续混淆类名变化导致整模块失效的概率。\n- 兼容微信输入法 4.0.0 原生工具栏命令载体字段变化，恢复“剪贴板”和“快捷发送／常用语”下滑入口。\n- 原生工具栏载体同时兼容旧 `f/g/h`、4.0.0 `g/h/i` 布局，并保留结构特征回退。\n- 保持动作 ID `0–20`、现有配置、默认键位和 v1.11.6“输入指定内容”等功能不变。\n\n完整变更请查看 [v1.11.7 Release](https://github.com/waoui/WeType-Swipe/releases/tag/v1.11.7) 和 [更新记录](CHANGELOG.md)。\n'''
          s = s[:start] + section + s[end:]
          s = s.replace('当前实测：微信输入法 3.5.0、3.5.2，Android 16', '当前实测：微信输入法 3.5.0、3.5.2、4.0.0，Android 16')
          p.write_text(s, encoding='utf-8')

          p = Path('.github/ISSUE_TEMPLATE/bug_report.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('placeholder: 例如 v1.11.6', 'placeholder: 例如 v1.11.7')
          s = s.replace('placeholder: 例如 3.5.2', 'placeholder: 例如 4.0.0')
          p.write_text(s, encoding='utf-8')

          Path('RELEASE_NOTES_v1.11.7.md').write_text('''# WeType-Swipe v1.11.7\n\n## 兼容性修复\n\n- 兼容微信输入法 4.0.0 的自绘键盘层变更：公共基类由旧版 `selfdraw.n` 迁移到 `selfdraw.o`。\n- 键盘基类识别增加结构特征回退，后续单字母混淆类名变化时不再只依赖固定类名。\n- 兼容微信输入法 4.0.0 原生工具栏命令载体字段从旧 `f/g/h` 迁移到新 `g/h/i`。\n- 恢复下滑打开原生剪贴板以及快捷发送／常用语。\n- 对 4.0.0 新点击链做适配，避免新增协程包装导致临时命令载体状态失效。\n\n## 保持兼容\n\n- 继续兼容微信输入法 3.5.0、3.5.2。\n- 动作 ID `0–20` 不变。\n- 配置格式、默认键位、指定内容、撤销／重做、全文／段落导航、内置 5 击设置入口均保持不变。\n\n## 版本\n\n- Version Name: `1.11.7`\n- Version Code: `53`\n''', encoding='utf-8')
          PY

          rm -f RELEASE_NOTES_v1.11.6.md
          rm -f tools/_promote_patch1.py tools/_promote_patch2.py
          rm -f .github/workflows/promote-v1.11.7.yml

          grep -q '^VERSION_CODE=53$' gradle.properties
          grep -q '^VERSION_NAME=1.11.7$' gradle.properties
          grep -q 'WETYPE_4_KEYBOARD_BASE = "com.tencent.wetype.plugin.hld.keyboard.selfdraw.o"' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          grep -q 'ToolbarCarrierLayout.resolve' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          test -f app/src/main/java/com/rww/wetypeswipe/ToolbarCarrierLayout.java
          test -f app/src/test/java/com/rww/wetypeswipe/ToolbarCarrierLayoutTest.java
          test -f RELEASE_NOTES_v1.11.7.md
          test ! -e RELEASE_NOTES_v1.11.6.md
          test ! -e tools/_promote_patch1.py
          test ! -e tools/_promote_patch2.py
          test ! -e .github/workflows/promote-v1.11.7.yml

      - name: 提交正式源码
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "准备 v1.11.7 正式源码"
          git push origin HEAD:release/v1.11.7
