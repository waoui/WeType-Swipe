name: 第一阶段架构重构测试构建

on:
  push:
    branches:
      - codex/refactor-phase1-v1.11.9-test1
    paths:
      - ".github/workflows/build-refactor-phase1-test.yml"
      - "tools/patch_refactor_phase1_test.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIGNING_STORE_FILE: ${{ github.workspace }}/signing.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: 1082df3bac441e9bd020ce640d66924de6c7dfb70836b262743e15777863c93a
      VERSION: 1.11.9-test1

    steps:
      - name: 检出重构分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 应用第一阶段重构
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_refactor_phase1_test.py
          grep -q '^VERSION_CODE=56$' gradle.properties
          grep -q '^VERSION_NAME=1.11.9-test1$' gradle.properties
          grep -q 'ActionRegistry.menuLabels()' app/src/main/java/com/rww/wetypeswipe/Config.java
          grep -q 'ConfigCodec.fromPreferences' app/src/main/java/com/rww/wetypeswipe/MainActivity.java
          grep -q 'new ConfigBridge' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          grep -q 'KeyboardCompat.findKeyboardBase' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          grep -q 'keyResolver.keyAfterDown' app/src/main/java/com/rww/wetypeswipe/MainHook.java
          test -f docs/ARCHITECTURE.md
          bytes="$(wc -c < app/src/main/java/com/rww/wetypeswipe/MainHook.java)"
          echo "MainHook bytes after refactor: ${bytes}"
          test "${bytes}" -lt 110000

      - name: 恢复永久签名证书
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"

      - name: 单元测试、Lint 与 Release 构建
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintRelease assembleRelease

      - name: 校验永久签名 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/WeType_Swipe_LSPosed_v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          verification="$($apksigner verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"
          normalized="$(printf '%s' "$verification" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          case "$normalized" in
            *"$EXPECTED_CERT_SHA256"*) ;;
            *) echo "Unexpected signing certificate" >&2; exit 1 ;;
          esac

      - name: 固化干净重构源码
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$SIGNING_STORE_FILE"
          rm -f tools/patch_refactor_phase1_test.py
          rm -f .github/workflows/build-refactor-phase1-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m '第一阶段架构重构（v1.11.9-test1） [phase1-generated]'
            git push origin HEAD:codex/refactor-phase1-v1.11.9-test1
          fi

      - name: 整理测试附件
        shell: bash
        run: |
          set -euo pipefail
          source="release/WeType_Swipe_LSPosed_v${VERSION}_source.zip"
          sums="release/WeType_Swipe_v${VERSION}_SHA256SUMS.txt"
          notes="release/TEST_NOTES_v${VERSION}.md"
          cp TEST_NOTES_v1.11.9-test1.md "$notes"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          out = Path('release/WeType_Swipe_LSPosed_v1.11.9-test1_source.zip')
          skip_parts = {'.git', '.gradle', 'build', 'release'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  if any(part in skip_parts for part in path.parts):
                      continue
                  if path.name == 'signing.jks':
                      continue
                  z.write(path, Path('WeType-Swipe-v1.11.9-test1') / path)
          PY
          (
            cd release
            sha256sum \
              "WeType_Swipe_LSPosed_v${VERSION}.apk" \
              "WeType_Swipe_LSPosed_v${VERSION}_source.zip" \
              "TEST_NOTES_v${VERSION}.md" > "$(basename "$sums")"
          )

      - name: 上传测试附件
        uses: actions/upload-artifact@v4
        with:
          name: WeType-Swipe-v1.11.9-test1-phase1-signed
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: 清理签名文件
        if: always()
        shell: bash
        run: rm -f "$SIGNING_STORE_FILE"
